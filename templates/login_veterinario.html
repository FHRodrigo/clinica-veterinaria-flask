<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Veterinarios | Clínica Veterinaria</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4 bg-white">
                    <div class="card-body">
                        <!-- Icono y Título -->
                        <div class="text-center mb-4">
                            <span class="bg-success bg-opacity-10 text-success p-3 rounded-circle d-inline-block shadow-sm mb-3">
                                <i class="fa-solid fa-user-doctor fa-2x"></i>
                            </span>
                            <h3 class="fw-bold text-dark">Portal Veterinario</h3>
                            <p class="text-muted small">Ingresa con tus credenciales de médico</p>
                        </div>

                        <!-- Alerta de Error -->
                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}

                        <!-- Formulario de Login -->
                        <form action="/login/veterinario" method="POST">
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold small text-secondary">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0" id="usuario" name="usuario" required placeholder="Usuario médico">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="contrasena" class="form-label fw-semibold small text-secondary">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0" id="contrasena" name="contrasena" required placeholder="••••••••">
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-success py-2 fw-semibold shadow-sm">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                                </button>
                            </div>
                        </form>

                        <!-- Enlace de regreso -->
                        <div class="text-center mt-3">
                            <a href="/" class="text-decoration-none text-muted small">
                                <i class="fa-solid fa-arrow-left me-1"></i> Regresar al Menú Principal
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
