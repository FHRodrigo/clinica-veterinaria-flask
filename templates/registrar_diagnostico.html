<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Diagnóstico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">📋 Registrar Diagnóstico Médico (Consulta #{{ consulta_id }})</h4>
                    </div>
                    <div class="card-body">
                        <form action="/veterinario/atender/{{ consulta_id }}" method="POST">
                            <div class="mb-3">
                                <label for="diagnostico" class="form-label">Diagnóstico Clínico</label>
                                <textarea class="form-control" id="diagnostico" name="diagnostico" rows="4" required placeholder="Describa el padecimiento o estado de salud..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="tratamiento" class="form-label">Tratamiento y Medicamentos</label>
                                <textarea class="form-control" id="tratamiento" name="tratamiento" rows="4" required placeholder="Indique dosis, medicamentos o cuidados..."></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/veterinario" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar y Finalizar Consulta</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
