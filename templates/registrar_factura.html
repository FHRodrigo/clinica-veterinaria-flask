<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Emitir Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">💳 Emitir Factura y Cobro</h4>
                    </div>
                    <div class="card-body">
                        {% if mensaje %}
                            <div class="alert alert-info">{{ mensaje }}</div>
                        {% endif %}
                        <form action="/recepcion/factura" method="POST">
                            <div class="mb-3">
                                <label for="consulta_id" class="form-label">Seleccionar Consulta Atendida</label>
                                <select class="form-select" id="consulta_id" name="consulta_id" >
                                    <option value="">-- Elige una Consulta --</option>
                                    {% for c in consultas %}
                                        <option value="{{ c[0] }}">Consulta #{{ c[0] }} - Motivo: {{ c[1] }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="total" class="form-label">Total a Pagar ($)</label>
                                <input type="number" step="0.01" class="form-control" id="total" name="total" >
                            </div>
                            <div class="mb-3">
                                <label for="metodo_pago" class="form-label">Método de Pago</label>
                                <select class="form-select" id="metodo_pago" name="metodo_pago">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta de Credito">Tarjeta de Crédito</option>
                                    <option value="Tarjeta de Debito">Tarjeta de Débito</option>
                                    <option value="Transferencia">Transferencia</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="referencia_pago" class="form-label">Referencia de Pago</label>
                                <input type="text" class="form-control" id="referencia_pago" name="referencia_pago" placeholder="Ej. REF-987654" >
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/recepcion" class="btn btn-secondary">Regresar</a>
                                <button type="submit" class="btn btn-dark">Generar Factura</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
