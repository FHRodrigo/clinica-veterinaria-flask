<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Mascota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">🐾 Registrar Nueva Mascota</h4>
                    </div>
                    <div class="card-body">
                        {% if mensaje %}
                            <div class="alert alert-info">{{ mensaje }}</div>
                        {% endif %}
                        <form action="/recepcion/mascota" method="POST">
                            <div class="mb-3">
                                <label for="dueno_id" class="form-label">Seleccionar Dueño</label>
                                <select class="form-select" id="dueno_id" name="dueno_id" >
                                    <option value="">-- Elige un Dueño --</option>
                                    {% for d in duenos %}
                                        <option value="{{ d[0] }}">{{ d[1] }} (ID: {{ d[0] }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Mascota</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" >
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="especie" class="form-label">Especie</label>
                                    <input type="text" class="form-control" id="especie" name="especie" placeholder="Ej. Perro, Gato" >
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="raza" class="form-label">Raza</label>
                                    <input type="text" class="form-control" id="raza" name="raza">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="edad" class="form-label">Edad (Años)</label>
                                    <input type="number" class="form-control" id="edad" name="edad">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="peso" class="form-label">Peso (kg)</label>
                                    <input type="number" step="0.01" class="form-control" id="peso" name="peso">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/recepcion" class="btn btn-secondary">Regresar</a>
                                <button type="submit" class="btn btn-success">Guardar Mascota</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
