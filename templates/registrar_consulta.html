<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programar Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">🩺 Programar Consulta Médica</h4>
                    </div>
                    <div class="card-body">
                        {% if mensaje %}
                            <div class="alert alert-info">{{ mensaje }}</div>
                        {% endif %}
                        <form action="/recepcion/consulta" method="POST">
                            <div class="mb-3">
                                <label for="mascota_id" class="form-label">Mascota Paciente</label>
                                <select class="form-select" id="mascota_id" name="mascota_id" >
                                    <option value="">-- Elige una Mascota --</option>
                                    {% for m in mascotas %}
                                        <option value="{{ m[0] }}">{{ m[1] }} (Especie: {{ m[2] }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="veterinario_id" class="form-label">Veterinario Asignado</label>
                                <select class="form-select" id="veterinario_id" name="veterinario_id" >
                                    <option value="">-- Elige un Veterinario --</option>
                                    {% for v in veterinarios %}
                                        <option value="{{ v[0] }}">{{ v[1] }} - {{ v[2] }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="motivo" class="form-label">Motivo de la Consulta</label>
                                <textarea class="form-control" id="motivo" name="motivo" rows="3" ></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/recepcion" class="btn btn-secondary">Regresar</a>
                                <button type="submit" class="btn btn-warning text-dark">Programar Cita</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
